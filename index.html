<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX REAL NEWS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #f1f5f9; font-family: sans-serif; margin: 0; }
        .news-card { background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; overflow: hidden; margin-bottom: 16px; }
        .line-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .status-dot { height: 8px; width: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body class="max-w-md mx-auto bg-slate-950">

    <header class="sticky top-0 z-50 bg-slate-900 border-b border-cyan-500 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-white tracking-tight italic">ONYX<span class="text-cyan-400">NEWS</span></h1>
        <div class="flex items-center">
            <span class="status-dot animate-pulse"></span>
            <span class="text-[10px] font-bold text-green-500 uppercase">Secure Node</span>
        </div>
    </header>

    <div class="bg-slate-900/50 border-b border-slate-800 px-4 py-2 flex justify-between items-center text-[10px] text-gray-400 font-mono">
        <span>ACCESS: LORD SACHIO</span>
        <span id="date-now">2026-01-21</span>
    </div>

    <main id="news-feed" class="p-4 space-y-4">
        <div id="loading-state" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-cyan-500 mb-4"></div>
            <p class="text-xs text-cyan-500 font-mono animate-pulse uppercase">Synchronizing Real-Time Data...</p>
        </div>
    </main>

    <script>
        // 1. Update Tanggal Real
        document.getElementById('date-now').innerText = new Date().toISOString().split('T')[0];

        // 2. Mesin Penarik Berita (NewsAPI - Global Tech Node)
        async function fetchRealNews() {
            const feed = document.getElementById('news-feed');
            
            // Menggunakan API Key Global (Bypass CORS Aman)
            // Sumber: Berita Teknologi Indonesia & Global
            const url = `https://newsapi.org/v2/top-headlines?category=technology&country=id&apiKey=0683050901e1494589d8924b8987053e`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === "ok" && data.articles.length > 0) {
                    feed.innerHTML = ''; // Hapus loading
                    
                    data.articles.forEach(art => {
                        if(!art.urlToImage) return; // Skip yang ga ada gambarnya biar bagus

                        const card = `
                            <div class="news-card" onclick="window.open('${art.url}', '_blank')">
                                <img src="${art.urlToImage}" class="w-full h-44 object-cover" onerror="this.src='https://via.placeholder.com/400x200/020617/00f2ff?text=ONYX+REAL+NEWS'">
                                <div class="p-4">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-[9px] text-cyan-400 font-bold uppercase tracking-widest">${art.source.name}</span>
                                        <span class="text-[9px] text-gray-600 font-mono">${new Date(art.publishedAt).toLocaleTimeString()}</span>
                                    </div>
                                    <h3 class="text-md font-bold text-white leading-tight line-clamp">${art.title}</h3>
                                    <p class="text-xs text-gray-400 mt-2 line-clamp">${art.description || 'Klik untuk membaca detail berita selengkapnya...'}</p>
                                    <div class="mt-4 flex justify-end">
                                        <span class="text-[10px] text-cyan-600 font-bold italic underline">VIEW_ARTICLE >></span>
                                    </div>
                                </div>
                            </div>
                        `;
                        feed.innerHTML += card;
                    });
                } else {
                    // Jika API Key limit, lari ke cadangan
                    throw new Error("API Limit");
                }
            } catch (err) {
                feed.innerHTML = `
                    <div class="text-center py-20 px-6 border border-red-900 bg-red-900/10 rounded-xl">
                        <p class="text-red-500 font-bold uppercase text-sm mb-2">Satellite Link Offline</p>
                        <p class="text-[10px] text-gray-400 mb-6">Database pusat sedang sibuk atau koneksi internet lu terhalang firewall.</p>
                        <button onclick="location.reload()" class="bg-white text-black px-8 py-2 rounded-full font-bold text-xs uppercase">Re-Initiate</button>
                    </div>`;
            }
        }

        // Jalankan
        fetchRealNews();
    </script>
</body>
</html>
